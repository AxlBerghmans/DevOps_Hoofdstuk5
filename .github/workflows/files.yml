name: Directory Example

on:
  workflow_dispatch:

jobs:
  directory-example:
    runs-on: ubuntu-latest

    steps:
      - name: Create directory
        run: mkdir testdirectory

      - name: Write text to file
        run: echo "Dit is een testbestand voor GitHub Actions." > testdirectory/test.txt

      - name: Show directory contents
        run: ls -alhR testdirectory

      - name: Display file contents
        run: cat testdirectory/test.txt
