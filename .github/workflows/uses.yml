name: Uses Examples
on: [push, workflow_dispatch]

jobs:
  uses-examples:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Execute Python script
        run: python my_script.py
